<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Laufzeit</title>
  <meta name="description" content="Python und C++ lernen, Lektion für Lektion.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/lesson.css">
  <link rel="stylesheet" href="css/onboarding.css">
  <link rel="stylesheet" href="css/projects.css">
  <link rel="stylesheet" href="css/social.css">
  <script>
    // Farbschema sofort setzen, damit beim Laden nichts aufblitzt
    try {
      var saved = JSON.parse(localStorage.getItem('laufzeit.v1') || '{}');
      var theme = (saved.settings && saved.settings.theme) || 'auto';
      if (theme === 'auto') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Laufzeit braucht JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
